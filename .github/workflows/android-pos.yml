name: ANIP proximity POS (Android)

on:
  push:
    paths:
      - "benin-proximity-pos/**"
      - ".github/workflows/android-pos.yml"
  pull_request:
    paths:
      - "benin-proximity-pos/**"
      - ".github/workflows/android-pos.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benin-proximity-pos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # The Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME);
      # AGP downloads any missing platform / build-tools on first use.
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests (verifier + screenshots) and debug APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: anip-proximity-pos-debug-apk
          path: benin-proximity-pos/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots-and-test-reports
          path: |
            benin-proximity-pos/app/screenshots/
            benin-proximity-pos/app/build/reports/tests/
